name: Build Bastion APK
on:
  workflow_dispatch:
  push:
    branches:
      - main
      - develop
      - 'feature/**'
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - name: Install Android API 37.0
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install 'platforms;android-37.0'
          # API 37 is published as android-37.0; some AGP lookups request android-37.
          # Keep the installed SDK intact and provide the alias only if needed.
          if [ -d "$ANDROID_HOME/platforms/android-37.0" ] && [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then
            ln -s android-37.0 "$ANDROID_HOME/platforms/android-37"
          fi
          test -f "$ANDROID_HOME/platforms/android-37.0/android.jar"
      - name: Restore signing keystore
        env:
          BASTION_KEYSTORE_BASE64: ${{ secrets.BASTION_KEYSTORE_BASE64 }}
        run: |
          test -n "$BASTION_KEYSTORE_BASE64" || { echo "Missing signing keystore secret"; exit 1; }
          printf '%s' "$BASTION_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/bastion-release.jks"
          chmod 600 "$RUNNER_TEMP/bastion-release.jks"
      - name: Set version identity
        env:
          REF_NAME: ${{ github.ref_name }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          if [ "$REF_NAME" = "main" ]; then
            echo "BASTION_VERSION_NAME=0.1.0" >> "$GITHUB_ENV"
          else
            # Each milestone declares the last global run before its first dev build.
            source .github/bastion-version.env
            DEV_NUMBER=$((RUN_NUMBER - BASTION_MILESTONE_BASE_RUN))
            test "$DEV_NUMBER" -ge 1 || { echo "Milestone baseline must precede this run"; exit 1; }
            echo "BASTION_VERSION_NAME=${BASTION_MILESTONE}-dev.${DEV_NUMBER}" >> "$GITHUB_ENV"
          fi
      - name: Build signed release APK
        env:
          BASTION_KEYSTORE_PATH: ${{ runner.temp }}/bastion-release.jks
          BASTION_KEYSTORE_PASSWORD: ${{ secrets.BASTION_KEYSTORE_PASSWORD }}
          BASTION_KEY_ALIAS: ${{ secrets.BASTION_KEY_ALIAS }}
          BASTION_KEY_PASSWORD: ${{ secrets.BASTION_KEY_PASSWORD }}
        run: |
          test -n "$BASTION_KEYSTORE_PASSWORD" && test -n "$BASTION_KEY_ALIAS" && test -n "$BASTION_KEY_PASSWORD" || { echo "Missing signing credentials"; exit 1; }
          gradle --no-daemon assembleRelease
      - name: Verify APK signature
        run: |
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/release/app-release.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Bastion-signed-apk
          path: app/build/outputs/apk/release/app-release.apk
      - name: Publish signed channel release
        env:
          GH_TOKEN: ${{ github.ref_name == 'main' && github.token || secrets.BASTION_DEV_RELEASE_TOKEN }}
          GH_REPO: ${{ github.ref_name == 'main' && 'koinupapi/Bastion' || 'koinupapi/bastion-dev-builds' }}
          REF_NAME: ${{ github.ref_name }}
          RUN_NUMBER: ${{ github.run_number }}
          COMMIT_SHA: ${{ github.sha }}
          VERSION_NAME: ${{ env.BASTION_VERSION_NAME }}
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN" || { echo "Missing publishing token"; exit 1; }
          if [ "$REF_NAME" = "main" ]; then
            CHANNEL="stable"
          elif [ "$REF_NAME" = "develop" ]; then
            CHANNEL="development"
          else
            CHANNEL="feature"
          fi
          TAG="build-${RUN_NUMBER}"
          APK="Bastion-${CHANNEL}-${RUN_NUMBER}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$APK"
          printf 'Channel: %s\nBranch: %s\nVersion: %s\nBuild: %s\nCommit: %s\n' "$CHANNEL" "$REF_NAME" "$VERSION_NAME" "$RUN_NUMBER" "$COMMIT_SHA" > release-notes.txt
          gh release create "$TAG" "$APK" \
            --repo "$GH_REPO" --prerelease \
            --title "Bastion ${CHANNEL} build ${RUN_NUMBER}" \
            --notes-file release-notes.txt
