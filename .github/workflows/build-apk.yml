name: Build Bastion APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Restore signing keystore
        env:
          BASTION_KEYSTORE_BASE64: ${{ secrets.BASTION_KEYSTORE_BASE64 }}
        run: |
          test -n "$BASTION_KEYSTORE_BASE64" || { echo "Missing signing keystore secret"; exit 1; }
          printf '%s' "$BASTION_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/bastion-release.jks"
          chmod 600 "$RUNNER_TEMP/bastion-release.jks"
      - name: Build signed release APK
        env:
          BASTION_KEYSTORE_PATH: ${{ runner.temp }}/bastion-release.jks
          BASTION_KEYSTORE_PASSWORD: ${{ secrets.BASTION_KEYSTORE_PASSWORD }}
          BASTION_KEY_ALIAS: ${{ secrets.BASTION_KEY_ALIAS }}
          BASTION_KEY_PASSWORD: ${{ secrets.BASTION_KEY_PASSWORD }}
        run: |
          test -n "$BASTION_KEYSTORE_PASSWORD" && test -n "$BASTION_KEY_ALIAS" && test -n "$BASTION_KEY_PASSWORD" || { echo "Missing signing credentials"; exit 1; }
          gradle --no-daemon assembleRelease
      - name: Verify APK signature
        run: |
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/release/app-release.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Bastion-signed-apk
          path: app/build/outputs/apk/release/app-release.apk
      - name: Publish development APK release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk Bastion-dev-${{ github.run_number }}.apk
          gh release create "dev-${{ github.run_number }}" "Bastion-dev-${{ github.run_number }}.apk" \
            --prerelease --target "${{ github.sha }}" \
            --title "Bastion development build ${{ github.run_number }}" \
            --notes "Signed development APK from successful GitHub Actions build ${{ github.run_number }}. Commit: ${{ github.sha }}."
